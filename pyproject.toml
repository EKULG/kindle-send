[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle-send"
dynamic = ["version"]
description = "Extract a web article from a URL and send it to your Kindle as an EPUB"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Luke G" }]
requires-python = ">=3.10"
keywords = ["kindle", "epub", "cli", "ebook", "send-to-kindle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "trafilatura>=1.12",
    "ebooklib>=0.18",
    "lxml>=4.9",
    "requests>=2.31",
    "Pillow>=10.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/EKULG/kindle-send"
Repository = "https://github.com/EKULG/kindle-send"
Issues = "https://github.com/EKULG/kindle-send/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kindle-send = "kindle_send.cli:main"

[tool.setuptools.packages.find]
include = ["kindle_send*"]

[tool.setuptools.dynamic]
version = {attr = "kindle_send.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
